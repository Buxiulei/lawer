# lawer-app 的 listen backlog drop-in —— 【样例，本文件不自动生效】
#
# 落位：/etc/systemd/system/lawer-app.service.d/lawer-app-backlog.conf
# 生效：systemctl daemon-reload && systemctl restart lawer-app   ← 要**重启**，reload 不换监听 socket
# 上产时机：滚版窗口内由 manager 执行。本仓不碰生产机。
#
# ── 解决什么 ───────────────────────────────────────────────────────────────
# Next standalone 的 server.js 走到 next/dist/server/lib/start-server.js:431
# 的 `server.listen(port, hostname)`，**不传 backlog** ⇒ Node 固定用 511。
# 内核实际取 min(应用值, net.core.somaxconn)，所以 somaxconn 已调到 4096 也没用——
# accept 队列仍是 511 深，千人级突发会被内核丢 SYN，且**应用层日志一行都不会有**。
# 预载脚本包一层 net.Server.prototype.listen，只在监听 $PORT 时补上 backlog。
#
# ── ⚠️ 两个坑 ─────────────────────────────────────────────────────────────
# 1. `Environment=NODE_OPTIONS=` 是**整体覆盖**不是追加。主 unit 或别的 drop-in
#    里若已有 NODE_OPTIONS（如 --max-old-space-size），必须在下面这一行里一并写全，
#    否则那些参数会被静默丢掉。先查：
#      systemctl show lawer-app -p Environment
# 2. 路径必须是**绝对路径**且指向实际部署出来的那份 deploy/ 目录。
#    写错会 MODULE_NOT_FOUND 硬失败（这是刻意的：宁可起不来，也不要静默退回 511）。
#    先确认文件在：  test -f /data/lawer/deploy/node-backlog-preload.js && echo OK

[Service]
Environment=NODE_OPTIONS=--require /data/lawer/deploy/node-backlog-preload.js
# 不写这行就用脚本内缺省 4096。取值应 ≥ net.core.somaxconn，再大只会被内核截断。
Environment=LISTEN_BACKLOG=4096

# ── 怎么验证真的生效（重启后在生产机上跑）────────────────────────────────
#   sysctl net.core.somaxconn                  # 前提：应为 4096，小于它则 backlog 被截到它
#   ss -lnt '( sport = :3000 )'                # LISTEN 行的 Send-Q 列 = 生效的 backlog
#
# 判读：Send-Q = 4096 ⇒ 生效； = 511 ⇒ **没生效**（预载没加载／路径错／端口对不上）。
# Send-Q 是队列上限，Recv-Q 是当前排队数——平时 Recv-Q 应贴近 0，
# 持续不为 0 说明 accept 跟不上，那就不是 backlog 的问题了。
